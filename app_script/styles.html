<style>
  :root {
    --color-ink: #0f172a;
    --color-muted: #475569;
    --color-surface: #ffffff;
    --color-surface-subtle: #f3f5fb;
    --color-primary: #1976d2;
    --color-secondary: #26c6da;
    --color-accent: #8e24aa;
    --color-highlight: #ff8f00;
    --color-success: #2e7d32;
    --color-error: #d32f2f;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--color-ink);
    background-color: var(--color-surface-subtle);
  }

  body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at top right, rgba(38, 198, 218, 0.2), transparent 45%),
      radial-gradient(circle at bottom left, rgba(142, 36, 170, 0.2), transparent 50%),
      var(--color-surface-subtle);
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  header h1 {
    margin: 0 0 1rem 0;
    flex: 1 1 100%;
    font-size: 2rem;
    background-image: linear-gradient(90deg, var(--color-primary), var(--color-accent), var(--color-highlight));
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  label {
    font-weight: 600;
    color: var(--color-muted);
  }

  input[type="date"],
  input[type="text"],
  select {
    margin-top: 0.25rem;
    padding: 0.5rem 0.75rem;
    border-radius: 10px;
    border: 1px solid rgba(25, 118, 210, 0.35);
    font-size: 0.95rem;
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(25, 118, 210, 0.12);
    min-width: 150px;
    background: linear-gradient(135deg, rgba(38, 198, 218, 0.08), rgba(142, 36, 170, 0.08));
  }

  select:disabled {
    opacity: 0.65;
    cursor: not-allowed;
  }

  button {
    padding: 0.65rem 1.35rem;
    border-radius: 999px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, box-shadow 0.15s ease;
  }

  button.primary {
    background-image: linear-gradient(135deg, var(--color-primary), var(--color-accent));
    color: white;
    box-shadow: 0 8px 16px rgba(25, 118, 210, 0.25);
  }

  button.secondary {
    background-color: white;
    color: var(--color-primary);
    border: 1px solid rgba(38, 198, 218, 0.6);
    box-shadow: 0 4px 12px rgba(38, 198, 218, 0.18);
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(15, 23, 42, 0.2);
  }

  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
  }

  .form-section,
  .schedule-section,
  .availability-section {
    background-color: var(--color-surface);
    border-radius: 20px;
    padding: 1.75rem;
    box-shadow: 0 16px 35px rgba(15, 23, 42, 0.1);
    border: 1px solid rgba(15, 23, 42, 0.04);
  }

  .form-section h2,
  .schedule-section h2,
  .availability-section h2 {
    margin-top: 0;
    font-size: 1.3rem;
    color: var(--color-primary);
  }

  .field-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 1rem;
  }

  .toggle-group .checkbox {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 600;
    color: var(--color-muted);
  }

  .toggle-group input[type="checkbox"] {
    width: 1.1rem;
    height: 1.1rem;
    accent-color: var(--color-accent);
    border-radius: 4px;
  }

  .time-group .time-inputs {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .time-group .time-inputs select {
    flex: 1 1 auto;
    min-width: 0;
  }

  .message {
    margin-top: 1rem;
    font-weight: 600;
    min-height: 1.5rem;
  }

  .message.success {
    color: var(--color-success);
  }

  .message.error {
    color: var(--color-error);
  }

  .schedule-table {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
  }

  th,
  td {
    border: 1px solid rgba(15, 23, 42, 0.08);
    padding: 0.75rem;
    text-align: center;
  }

  th {
    background-image: linear-gradient(135deg, rgba(25, 118, 210, 0.18), rgba(142, 36, 170, 0.22));
    color: var(--color-ink);
    font-weight: 700;
  }

  tbody tr:nth-child(even) {
    background-color: rgba(38, 198, 218, 0.08);
  }

  .free-rooms {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .room-card {
    border: 1px solid rgba(142, 36, 170, 0.2);
    border-radius: 14px;
    padding: 1rem;
    background: linear-gradient(135deg, rgba(255, 143, 0, 0.08), rgba(38, 198, 218, 0.12));
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.05);
  }

  .room-card h3 {
    margin: 0 0 0.5rem;
    color: var(--color-accent);
  }

  .slot-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .slot {
    background: white;
    border: 1px solid rgba(25, 118, 210, 0.3);
    border-radius: 9999px;
    padding: 0.3rem 0.75rem;
    font-size: 0.85rem;
    color: var(--color-muted);
    box-shadow: 0 4px 10px rgba(25, 118, 210, 0.12);
  }

  .slot.empty {
    border-style: dashed;
    color: rgba(15, 23, 42, 0.55);
    background: rgba(255, 143, 0, 0.12);
  }

  @media (max-width: 768px) {
    .controls {
      flex-direction: column;
      align-items: flex-start;
    }

    header h1 {
      font-size: 1.6rem;
    }
  }
</style>
